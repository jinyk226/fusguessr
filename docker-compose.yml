# Local Postgres for development and the integration test suite.
#
#   docker compose up -d
#
# Two databases: the app's, and a separate one for integration tests, which
# truncate every table between cases.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fusguessr
    ports:
      - "5432:5432"
    volumes:
      - fusguessr-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fusguessr-pgdata:
